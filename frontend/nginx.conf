server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, Swagger docs and health check -> FastAPI backend
    # Docker DNS; re-resolve so a rebuilt backend container (new IP) is picked up
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api/|docs|openapi\.json$|health$) {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
